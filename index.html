<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Log Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--Header-->

    <header class="page-header">
        <h1>Security Log Analyzer</h1>
    </header>

    <!--Grid for upload log file, analyze,supported format, analysis result, summary-->
    <div class="grid-container">
        <div class="upload-file">
            <h3>1. Upload Log File</h3>
            <p>Upload a .txt log file to analyze for suspcicious activity.</p>

            <label class="custom-file-upload">
                <input type="file" id ="logInput" accept=".txt">
                    <p id="uploadText">Click to upload your file</p>

                <!--upload an image for file icon-->
                <div class="image-container">
                    <img src="images/upload.png" alt="Upload file icon" class="responsive-img">
                </div>
            </label>
        </div>
    </div>
    
    <div class = "analyze-file">
        <h3>2. Analyze</h3>
    </div>
    <div class = "grid-item">3</div> 



    <script src="script.js"></script>
</body>
</html>

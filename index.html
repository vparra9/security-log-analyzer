<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Log Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--Header-->

    <header class="page-header">
        <h1>Security Log Analyzer</h1>
    </header>

    <!--Grid for upload log file, analyze,supported format, analysis result, summary-->
    <div class="grid-container">
        <div class="upload-file">
            <h3>1. Upload Log File</h3>
            <p>Upload a .log or .txt log file to analyze for suspcicious activity.</p>

            <label class="custom-file-upload">
                <input type="file" id ="logInput" accept=".log, .txt">
                    <p id="uploadText">Click to upload your file</p>

                <!--upload an image for file icon-->
                <div class="image-container">
                    <img src="images/upload.png" alt="Upload file icon" class="responsive-img">
                </div>
            </label>
        </div>
    </div>
    
    <div class = "analyze-file">
        <h3>2. Analyze</h3>
        <p>Click the button below to analyze the uploaded log file.</p>
        <button id="analyzeBtn">
            <span class="button-text">Analyze Log</span>
        </button>
    </div>
    
    <div class = "supported-format">
        <h3>Supported format</h3>
        <p>.txt and .log files only. Max size: 5MB</p>
    </div> 


    <script src="script.js"></script>
</body>
</html>
